services:
  database:
    container_name: database
    build:
      context: ./database
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 10s
      retries: 5

  api:
    container_name: api
    build:
      context: ./backend
    ports:
      - 8080:8080
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASS: password
      ORIGIN: http://localhost:5173
    depends_on:
      database:
        condition: "service_healthy"
