services:
  db:
    container_name: db
    image: postgres:18.1-alpine3.23
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 10s
      retries: 5

  app:
    container_name: app
    build:
      context: ./
    ports:
      - 8080:8080
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASS: password
      ORIGIN: http://localhost:5173
      SECURE: false
    depends_on:
      db:
        condition: "service_healthy"
