name: Database

on:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths:
      - "database/**"
      - ".github/workflows/database.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "database/**"
      - ".github/workflows/database.yaml"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./database
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build image
        run: |
          docker build -t database:local .

      - name: Save image
        run: docker save database:local -o database-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: database-image
          path: ./database/database-image.tar
          retention-days: 1

  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ./database
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: database-image

      - name: Load image
        run: docker load -i database-image.tar

      - name: Get tag name
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Tag and push
        run: |
          docker tag database:local ghcr.io/creed-braton/sudojo-database:${{ steps.tag.outputs.VERSION }}
          docker push ghcr.io/creed-braton/sudojo-database:${{ steps.tag.outputs.VERSION }}
