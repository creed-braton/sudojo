name: CI

on:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - ".github/workflows/ci.yaml"

jobs:
  lint-frontend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

  lint-backend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.1"
          cache-dependency-path: ./backend/go.sum

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

  test-backend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    needs: [lint-backend]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Pull and start database container
        run: |
          docker pull postgres:18.1-alpine3.23
          docker run -d \
            --name test-db \
            -p 5432:5432 \
            -e POSTGRES_PASSWORD=password \
            postgres:18.1-alpine3.23

      - name: Wait for database to be ready
        run: |
          until docker exec test-db pg_isready -U postgres -d postgres; do
            echo "Waiting for database..."
            sleep 2
          done

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.1"
          cache-dependency-path: ./backend/go.sum

      - name: Run tests
        run: go test -v ./...

  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    needs: [lint-frontend, test-backend]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build image
        run: |
          docker build -t sudojo .

  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build image
        run: |
          docker build -t sudojo .

      - name: Get tag name
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Tag and push
        run: |
          docker tag sudojo ghcr.io/creed-braton/sudojo:${{ steps.tag.outputs.VERSION }}
          docker push ghcr.io/creed-braton/sudojo:${{ steps.tag.outputs.VERSION }}
